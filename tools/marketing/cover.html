<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 700;
        src: url('../../game/assets/fonts/fredoka-latin-700-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import { drawCover } from './cover.js';
      const kind = new URLSearchParams(location.search).get('kind') || 'landscape';
      await document.fonts.load('700 40px Fredoka');
      drawCover(kind, document.getElementById('c'));
      window.__ready = true;
    </script>
  </body>
</html>
